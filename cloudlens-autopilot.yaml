AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudLens AutoPilot — One-Click Keysight Visibility Stack Deployment
  Deploys KVO + CLMS + vPB with VPC networking, IAM, SSM documents,
  and auto-mirror Lambda for automatic VPC Traffic Mirroring.
  Keysight Technologies | v2.0

# =============================================================================
# METADATA — Controls AWS Console parameter grouping and ordering
# =============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment Information
        Parameters:
          - DeploymentName
          - OwnerTag
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
          - MgmtSubnetCidr
          - DataSubnetCidr
          - ToolSubnetCidr
          - AllowedSshCidrs
          - AllowedWebCidrs
      - Label:
          default: Keysight Products
        Parameters:
          - DeployKVO
          - DeployCLMS
          - DeployVPB
          - KvoInstanceType
          - ClmsInstanceType
          - VpbInstanceType
          - KeyPairName
      - Label:
          default: Auto-Mirror (Traffic Mirroring Automation)
        Parameters:
          - EnableAutoMirror
          - MirrorTagKey
          - MirrorTagValue
      - Label:
          default: Sensor Deployment
        Parameters:
          - WindowsInstallerS3Bucket
          - WindowsInstallerS3Key
      - Label:
          default: Lambda Code Location
        Parameters:
          - LambdaS3Bucket
          - LambdaS3Key
    ParameterLabels:
      DeploymentName:
        default: Deployment Name (used as resource prefix)
      OwnerTag:
        default: Owner (for cost tracking)
      VpcCidr:
        default: VPC CIDR Block
      AllowedSshCidrs:
        default: Your IP for SSH Access (x.x.x.x/32)
      AllowedWebCidrs:
        default: Your IP for Web UI Access (x.x.x.x/32)
      DeployKVO:
        default: Deploy KVO (Vision Orchestrator)
      DeployCLMS:
        default: Deploy CLMS (CloudLens Manager)
      DeployVPB:
        default: Deploy vPB (Virtual Packet Broker)
      KeyPairName:
        default: EC2 Key Pair Name
      EnableAutoMirror:
        default: Enable automatic VPC Traffic Mirroring for tagged instances
      MirrorTagKey:
        default: Tag key that triggers auto-mirroring
      MirrorTagValue:
        default: Tag value that triggers auto-mirroring

# =============================================================================
# PARAMETERS
# =============================================================================
Parameters:
  DeploymentName:
    Type: String
    Default: demo
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase prefix for all resources (e.g., demo, acme-poc)

  OwnerTag:
    Type: String
    Default: ''
    Description: Owner name for cost tracking tags

  # --- Network ---
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block (e.g., 10.0.0.0/16)

  MgmtSubnetCidr:
    Type: String
    Default: '10.0.1.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block (e.g., 10.0.1.0/24)

  DataSubnetCidr:
    Type: String
    Default: '10.0.2.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block

  ToolSubnetCidr:
    Type: String
    Default: '10.0.3.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block

  AllowedSshCidrs:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR (e.g., 203.0.113.50/32). Do NOT use 0.0.0.0/0 in production.
    Description: Your IP for SSH access (REQUIRED - use x.x.x.x/32 format)

  AllowedWebCidrs:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR (e.g., 203.0.113.50/32). Do NOT use 0.0.0.0/0 in production.
    Description: Your IP for Web UI access (REQUIRED - use x.x.x.x/32 format)

  # --- Products ---
  DeployKVO:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  DeployCLMS:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  DeployVPB:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  KvoInstanceType:
    Type: String
    Default: c5.2xlarge
    AllowedValues: [c5.2xlarge]
    Description: Marketplace-restricted to c5.2xlarge

  ClmsInstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.xlarge, t3.2xlarge, m5.xlarge]

  VpbInstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.xlarge]
    Description: Marketplace-restricted to t3.xlarge

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access

  # --- Auto-Mirror ---
  EnableAutoMirror:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  MirrorTagKey:
    Type: String
    Default: cloudlens-mirror
    Description: EC2 tag key that triggers automatic traffic mirroring

  MirrorTagValue:
    Type: String
    Default: 'true'
    Description: EC2 tag value that triggers automatic traffic mirroring

  # --- Sensor ---
  WindowsInstallerS3Bucket:
    Type: String
    Default: ''
    Description: S3 bucket containing Windows sensor .EXE (optional)

  WindowsInstallerS3Key:
    Type: String
    Default: cloudlens-win-sensor-6.12.0.316.exe
    Description: S3 key for Windows sensor installer

  LambdaS3Bucket:
    Type: String
    Default: cloudlens-autopilot-artifacts
    Description: S3 bucket containing auto-mirror Lambda ZIP

  LambdaS3Key:
    Type: String
    Default: auto-mirror-lambda.zip
    Description: S3 key for auto-mirror Lambda ZIP package

